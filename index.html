<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Интерактивный справочник и тренажёр по графикам алгебраических функций и их преобразованиям для быстрой подготовки к зачёту, ОГЭ и ЕГЭ.">
  <title>Графики функций и их преобразования | Интерактивный тренажёр к зачёту</title>

  <!-- Шрифты Google Fonts: Fira Sans и Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX для математических формул: локальный бандл + CDN fallback -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="vendor/katex/katex.min.js"></script>
  <script>
    if (typeof window.katex === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>');
    }
  </script>

  <!-- Стили приложения -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- Верхняя панель и SPA-навигация -->
  <header class="app-header">
    <div class="header-container">
      <a href="#playground" class="brand-logo" title="На главную">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.5"><path d="M3 18l5-12 4 10 4-6 5 8"/></svg>
        </div>
        <span>Алгебра: Графики</span>
        <span class="brand-badge">Зачёт</span>
      </a>

      <!-- Вкладки SPA -->
      <nav class="nav-tabs" role="tablist">
        <button class="nav-tab-btn nav-tab-active" data-tab="playground" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Лаборатория
        </button>
        <button class="nav-tab-btn" data-tab="catalog" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Список графиков
        </button>
        <button class="nav-tab-btn" data-tab="transforms" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          Преобразования
        </button>
        <button class="nav-tab-btn" data-tab="cheatsheet" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Шпаргалка
        </button>
        <button class="nav-tab-btn" data-tab="trainer" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Тренажёр
        </button>
      </nav>
    </div>
  </header>

  <!-- Главная область экранов SPA -->
  <main class="main-content">

    <!-- ====================================================================
         ЭКРАН 1: ИНТЕРАКТИВНАЯ ЛАБОРАТОРИЯ
         ==================================================================== -->
    <section id="view-playground" class="tab-view tab-view-active">
      <div class="pg-layout">
        <!-- Левая колонка: интерактивный холст -->
        <div class="pg-canvas-column">
          <div class="canvas-viewport-card">
            <!-- Верхняя плашка текущей формулы -->
            <div class="formula-overlay-card">
              <div class="formula-main math-display" id="pg-formula-display">y = x^2</div>
              <div class="canvas-legend">
                <div class="legend-item" title="Исходное положение функции">
                  <span class="legend-line line-ghost"></span>
                  <span>f(x)₀ начальный</span>
                </div>
                <div class="legend-item" title="Преобразованный график">
                  <span class="legend-line line-active"></span>
                  <span>g(x) результат</span>
                </div>
                <div class="legend-item" title="Вертикальные и горизонтальные асимптоты">
                  <span class="legend-line line-asymp"></span>
                  <span>Асимптоты</span>
                </div>
              </div>
            </div>

            <!-- Сам холст -->
            <div class="canvas-container">
              <canvas id="pg-canvas"></canvas>
            </div>

            <!-- Нижняя панель инспектора координат -->
            <div class="inspector-bar" id="inspector-display">
              Наведите курсор или проведите пальцем по графику для просмотра значений координат (x, y)
            </div>
          </div>

          <!-- Свойства базовой функции и стек шагов -->
          <div class="steps-card">
            <div class="control-label">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Пошаговый разбор преобразования:
            </div>
            <div id="pg-base-info" style="margin-top: 8px;"></div>
            <div class="steps-list" id="pg-steps-list"></div>
          </div>
        </div>

        <!-- Правая колонка: панель управления и слайдеры -->
        <div class="pg-controls-column">
          <div class="pg-controls-card" id="pg-controls">
            <!-- Заполняется динамически скриптом playground.js -->
          </div>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         ЭКРАН 2: СПИСОК ГРАФИКОВ (АТЛАС К ЗАЧЕТУ)
         ==================================================================== -->
    <section id="view-catalog" class="tab-view">
      <div id="catalog-content-container">
        <!-- Заполняется динамически скриптом catalog.js -->
      </div>
    </section>

    <!-- ====================================================================
         ЭКРАН 3: СПИСОК ПРЕОБРАЗОВАНИЙ
         ==================================================================== -->
    <section id="view-transforms" class="tab-view">
      <div id="transforms-content-container">
        <!-- Заполняется динамически скриптом transforms-view.js -->
      </div>
    </section>

    <!-- ====================================================================
         ЭКРАН 4: ШПАРГАЛКА К ЗАЧЕТУ
         ==================================================================== -->
    <section id="view-cheatsheet" class="tab-view">
      <div id="cheatsheet-content-container">
        <!-- Заполняется динамически скриптом cheatsheet.js -->
      </div>
    </section>

    <!-- ====================================================================
         ЭКРАН 5: ТРЕНАЖЁР САМОПРОВЕРКИ
         ==================================================================== -->
    <section id="view-trainer" class="tab-view">
      <div id="trainer-content-container">
        <!-- Заполняется динамически скриптом trainer.js -->
      </div>
    </section>

  </main>

  <!-- Скрипты приложения -->
  <script src="js/math-core.js"></script>
  <script src="js/transformations.js"></script>
  <script src="js/canvas-engine.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/transforms-view.js"></script>
  <script src="js/cheatsheet.js"></script>
  <script src="js/trainer.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
